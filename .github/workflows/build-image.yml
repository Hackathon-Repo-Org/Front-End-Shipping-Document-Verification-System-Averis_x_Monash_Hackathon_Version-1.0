name: Build and push image

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login shipdocacrle2026.azurecr.io -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build -t shipdocacrle2026.azurecr.io/shipdoc:latest .

      - name: Push image
        run: docker push shipdocacrle2026.azurecr.io/shipdoc:latest
